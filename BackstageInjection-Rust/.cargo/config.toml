# Statically link the CRT so the injected DLL has no VCRUNTIME/UCRT DLL
# dependency at runtime (Chrome and other targets may not have it preloaded).
#
# Only the GNU target is supported: the reflective loader manually maps the
# image, and the MSVC CRT's TLS/CFG/stack-cookie machinery fast-fails
# (0xC0000409) under a manual map. See scripts/build-backstage-dll.{sh,bat}.
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-feature=+crt-static"]