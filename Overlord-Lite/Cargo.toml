[package]
name = "overlord-lite"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Minimal Rust agent for authenticated Overlord sessions"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
futures-util = "0.3"
overlord-lite-string-obfuscator = { path = "string-obfuscator" }
portable-pty = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }
rmp-serde = "1.3"
rmpv = { version = "1.3", features = ["with-serde"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

[build-dependencies]
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
